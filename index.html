<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBook - সোশাল মিডিয়া</title>
    <!-- ফন্ট অসম এবং গুগল ফন্ট -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1877f2;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #050505;
            --secondary-text: #65676b;
            --border-color: #ddd;
        }

        .dark-mode {
            --primary-color: #2d88ff;
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --secondary-text: #b0b3b8;
            --border-color: #393a3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }

        /* হেডার বা নবার */
        header {
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-area h1 {
            color: var(--primary-color);
            font-size: 26px;
            font-weight: 700;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            background: var(--bg-color);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            font-size: 18px;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--border-color);
        }

        /* মেইন কন্টেইনার */
        .main-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 10px;
        }

        /* পোস্ট ক্রিয়েট বক্স */
        .create-post-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .post-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .post-input-row input {
            flex: 1;
            background-color: var(--bg-color);
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            color: var(--text-color);
            font-size: 15px;
            outline: none;
        }

        .post-actions-row {
            display: flex;
            justify-content: space-around;
            padding-top: 10px;
        }

        .action-option {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            gap: 5px;
            align-items: center;
            color: var(--secondary-text);
            font-weight: 500;
            font-size: 14px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        .action-option:hover {
            background-color: var(--bg-color);
        }

        .post-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        /* নিউজফিড পোস্ট কার্ড */
        .post-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            padding: 15px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .user-info h4 {
            font-size: 15px;
            color: var(--text-color);
        }

        .user-info span {
            font-size: 12px;
            color: var(--secondary-text);
        }

        .post-body {
            font-size: 15px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .post-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--secondary-text);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .post-footer-actions {
            display: flex;
            justify-content: space-between;
        }

        .post-footer-actions button {
            flex: 1;
            background: none;
            border: none;
            padding: 8px;
            cursor: pointer;
            color: var(--secondary-text);
            font-weight: 600;
            font-size: 14px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .post-footer-actions button:hover {
            background-color: var(--bg-color);
        }

        .post-footer-actions button.liked {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- হেডার বার -->
    <header>
        <div class="logo-area">
            <h1>IBook</h1>
        </div>
        <div class="header-icons">
            <button class="icon-btn" onclick="toggleDarkMode()" title="ডার্ক মোড পরিবর্তন করুন"><i class="fa-solid fa-moon"></i></button>
            <div class="avatar" style="width: 35px; height: 35px; font-size: 14px;">আ</div>
        </div>
    </header>

    <!-- মূল কন্টেন্ট ফিড -->
    <div class="main-container">
        
        <!-- পোস্ট লেখার বক্স -->
        <div class="create-post-card">
            <div class="post-input-row">
                <div class="avatar">আ</div>
                <input type="text" id="postText" placeholder="আপনার মনে কী চলছে, আহমাদুল্লাহ?">
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                <div style="display: flex; gap: 5px;">
                    <button class="action-option"><i class="fa-solid fa-image" style="color: #45bd62;"></i> ছবি/ভিডিও</button>
                    <button class="action-option"><i class="fa-solid fa-face-smile" style="color: #f7b125;"></i> অনুভূতি</button>
                </div>
                <button class="post-btn" onclick="addNewPost()">পোস্ট করুন</button>
            </div>
        </div>

        <!-- নিউজফিড সেকশন -->
        <div id="feedContainer">
            <!-- ডামি পোস্ট ১ -->
            <div class="post-card">
                <div class="post-header">
                    <div class="user-info">
                        <div class="avatar" style="background-color: #e41e3f;">স</div>
                        <div>
                            <h4>আহমাদুল্লাহ আশরাফ</h4>
                            <span>১০ মিনিট আগে</span>
                        </div>
                    </div>
                    <i class="fa-solid fa-ellipsis" style="color: var(--secondary-text); cursor: pointer;"></i>
                </div>
                <div class="post-body">
                    আলহামদুলিল্লাহ! আজ আমার স্বপ্নের প্রজেক্ট IBook-এর প্রথম কোডিং ভার্সন তৈরি করলাম। শূন্য টাকায় কোডিং ছাড়া অসাধারণ অভিজ্ঞতা! 🚀
                </div>
                <div class="post-stats">
                    <span><i class="fa-solid fa-thumbs-up" style="color: var(--primary-color);"></i> ৫ জন লাইক দিয়েছেন</span>
                    <span>২টি কমেন্ট</span>
                </div>
                <div class="post-footer-actions">
                    <button onclick="toggleLike(this)"><i class="fa-regular fa-thumbs-up"></i> লাইক</button>
                    <button><i class="fa-regular fa-comment"></i> কমেন্ট</button>
                    <button><i class="fa-solid fa-share"></i> শেয়ার</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // নতুন পোস্ট যোগ করার ফাংশন
        function addNewPost() {
            const textInput = document.getElementById('postText');
            const postText = textInput.value.trim();

            if(postText === "") {
                alert("দয়া করে কিছু লিখে তারপর পোস্ট করুন!");
                return;
            }

            const feedContainer = document.getElementById('feedContainer');

            // নতুন পোস্টের HTML স্ট্রাকচার
            const newPostHTML = `
                <div class="post-card">
                    <div class="post-header">
                        <div class="user-info">
                            <div class="avatar">আ</div>
                            <div>
                                <h4>আহমাদুল্লাহ আশরাফ</h4>
                                <span>এই মাত্র</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-ellipsis" style="color: var(--secondary-text); cursor: pointer;"></i>
                    </div>
                    <div class="post-body">
                        ${postText}
                    </div>
                    <div class="post-stats">
                        <span><i class="fa-solid fa-thumbs-up" style="color: var(--primary-color);"></i> ১ জন</span>
                        <span>০ কমেন্ট</span>
                    </div>
                    <div class="post-footer-actions">
                        <button onclick="toggleLike(this)"><i class="fa-regular fa-thumbs-up"></i> লাইক</button>
                        <button><i class="fa-regular fa-comment"></i> কমেন্ট</button>
                        <button><i class="fa-solid fa-share"></i> শেয়ার</button>
                    </div>
                </div>
            `;

            // ফিডের একদম উপরে নতুন পোস্ট যুক্ত করা
            feedContainer.insertAdjacentHTML('afterbegin', newPostHTML);
            
            // ইনপুট বক্স খালি করা
            textInput.value = "";
        }

        // লাইক বাটন টগল করার ফাংশন
        function toggleLike(btn) {
            btn.classList.toggle('liked');
            const icon = btn.querySelector('i');
            if(btn.classList.contains('liked')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid');
            } else {
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
            }
        }

        // ডার্ক মোড অন/অফ করার ফাংশন
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

const app = initializeApp(firebaseConfig);

    </script>
</body>
</html>
